<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Tracker </title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    
    <div class="header-mobile"></div>

    <div class="main-container">

        <div class="left-pane blue-gradient-overlay">
            <div class="content">
                <div>
                    <div style="display: flex; align-items: center; font-size: 1.25rem; font-weight: 700; margin-bottom: 40px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                            <path d="M12 5v14"/>
                            <path d="M5 12h14"/>
                        </svg>
                        Hospital Tracker
                    </div>
                </div>

                <div>
                    <h1 style="font-size: 2.25rem; font-weight: 800; margin-bottom: 16px; line-height: 1.25;">
                        Welcome to Hospital Tracker
                    </h1>
                    <p style="font-size: 1.125rem; opacity: 0.9;">
                        Log in to seamlessly manage patients, appointments, and hospital resources.
                    </p>
                </div>

               
            </div>
        </div>

        <div class="right-pane">
            <div class="login-card">
                <h2 style="font-size: 1.875rem; font-weight: 700; color: #1f2937; margin-bottom: 24px; text-align: center;">Login</h2>

                <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;">
                    <button class="social-btn">
                        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M43.61 20.0865H24.36V28.9H35.845C34.775 32.17 32.25 34.62 29.1 36.315V42.02C33.68 40.54 37.34 37.05 39.755 32.74C42.17 28.43 43.61 24.12 43.61 20.0865Z" fill="#4285F4"/>
                            <path d="M24.36 44C30.635 44 35.845 42.115 39.755 38.64L34.1 34.11C32.4 35.15 30.435 35.875 28.36 36.315C26.285 36.755 24.36 36.565 22.36 36.315C16.895 36.315 12.22 34.225 9.07 30.13L3.715 33.87C6.01 37.89 9.38 41.26 13.565 43.155C17.75 45.05 22.185 45.49 26.62 45.49C27.56 45.49 28.5 45.49 29.44 45.3C30.38 45.11 31.32 44.92 32.26 44.73C33.2 44.54 34.14 44.35 35.08 44.16C36.02 43.97 36.96 43.78 37.9 43.59C38.84 43.4 39.78 43.21 40.72 43.02C41.66 42.83 42.6 42.64 43.54 42.45Z" fill="#34A853"/>
                            <path d="M9.07 30.13C8.425 28.7 8.05 27.27 7.86 25.84C7.67 24.41 7.67 22.98 7.86 21.55C8.05 20.12 8.425 18.69 9.07 17.26L3.715 13.52C2.775 16.03 2.13 18.88 2.13 22.04C2.13 25.2 2.775 28.05 3.715 30.56L9.07 34.215L9.07 30.13Z" fill="#FBBC05"/>
                            <path d="M39.755 12.57L34.4 16.315C32.79 15.275 30.825 14.55 28.75 14.11C26.675 13.67 24.5 13.86 22.505 14.11C16.895 14.11 12.22 16.2 9.07 20.29L3.715 16.545C6.01 12.525 9.38 9.155 13.565 7.26C17.75 5.365 22.185 4.925 26.62 4.925C27.56 4.925 28.5 4.925 29.44 5.115C30.38 5.305 31.32 5.495 32.26 5.685C33.2 5.875 34.14 6.065 35.08 6.255C36.02 6.445 36.96 6.635 37.9 6.825C38.84 7.015 39.78 7.205 40.72 7.395C41.66 7.585 42.6 7.775 43.54 7.965Z" fill="#EA4335"/>
                        </svg>
                        Sign in with Google
                    </button>

                    <button class="social-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 10V4H5a2 2 0 0 0-2 2v7c0 1.1.9 2 2 2h7l-3 4h8"/>
                            <circle cx="18" cy="16" r="3"/>
                        </svg>
                        Sign in with iCloud
                    </button>
                </div>

                <div class="separator-container">
                    <div class="separator-line"></div>
                    <span class="separator-text">Or log in with</span>
                    <div class="separator-line"></div>
                </div>

                <form >
                    <div class="input-group" style="margin-bottom: 16px;">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="name@hospital.com">
                    </div>

                    <div class="input-group" style="margin-bottom: 16px;">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <a href="./signup.html" class="link">
                            Create account
                        </a>
                        <a href="./forgotPass.html" class="link">
                            Forgot password?
                        </a>
                    </div>

                    <button type="submit" class="login-btn">
                        Log In
                        <a href="./landing page.html">check</a>
                    </button>
                </form>
                 
            </div>
        </div>
    </div>
</body>
</html>
