<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Tracker - Forgot Password</title>
    <link rel="stylesheet" href="forgot.css">
</head>

<body>

    <div class="header-mobile"></div>

    <div class="main-container">

        <div class="left-pane blue-gradient-overlay">
            <div class="content">
                <div>
                    <div
                        style="display: flex; align-items: center; font-size: 1.25rem; font-weight: 700; margin-bottom: 40px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="margin-right: 8px;">
                            <path d="M12 5v14" />
                            <path d="M5 12h14" />
                        </svg>
                        Hospital Tracker
                    </div>
                </div>

                <div>
                    <h1 style="font-size: 2.25rem; font-weight: 800; margin-bottom: 16px; line-height: 1.25;">
                        Trouble Logging In?
                    </h1>
                    <p style="font-size: 1.125rem; opacity: 0.9;">
                        Enter your account email to receive a secure link and regain access to the Hospital Tracker
                        system.
                    </p>
                </div>

            </div>
        </div>

        <div class="right-pane">
            <div class="login-card">
                <h2
                    style="font-size: 1.875rem; font-weight: 700; color: #1f2937; margin-bottom: 8px; text-align: center;">
                    Reset Your Password</h2>

                <p style="font-size: 0.875rem; color: #6b7280; text-align: center; margin-bottom: 24px;">
                    We'll send you a password reset link.
                </p>

                <form>
                    <div class="input-group" style="margin-bottom: 24px;">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="name@hospital.com">
                    </div>

                    <button type="submit" class="submit-btn">
                        Send Reset Link
                    </button>
                </form>

                <div style="text-align: center; margin-top: 24px;">
                    <a href="./index.html" class="link">
                        &larr; Back to Login
                    </a>
                </div>

                <div id="messageBox" class="message-box hidden" role="alert">
                    <span id="messageText"></span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
