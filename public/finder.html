<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finder · Hospital Tracker</title>
  <meta name="description" content="Find hospitals and clinics near you.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M14 8h4v6h6v4h-6v6h-4v-6H8v-4h6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>body { visibility: hidden; } body.ready { visibility: visible; }</style>
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="index.html">
          <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg></span>
          Hospital Tracker
        </a>
        <div class="header-actions">
          <span class="user-chip" data-auth="in"><span class="avatar" data-user-initial></span><span class="name" data-user-name></span></span>
          <button class="btn btn-secondary btn-sm" type="button" data-signout>Sign out</button>
        </div>
      </div>
    </header>

    <div class="emergency-bar" role="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
      In a life-threatening emergency, call your local emergency number (e.g. 911, 112, 999) right away.
    </div>

    <div class="app-body">
      <section class="sidebar" aria-label="Search and results">
        <div class="controls">
          <button id="locateBtn" class="btn btn-primary btn-block" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
            Use my current location
          </button>

          <form id="searchForm" class="search-row" role="search">
            <label for="place" class="sr-only">City, area or address</label>
            <input id="place" class="input" type="search" placeholder="Or search a city or address…" autocomplete="off">
            <button class="btn btn-secondary" type="submit" aria-label="Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            </button>
          </form>

          <div class="filters">
            <label class="checkbox" for="radius" style="gap:6px">
              Within
              <select id="radius" class="select">
                <option value="2000">2 km</option>
                <option value="5000" selected>5 km</option>
                <option value="10000">10 km</option>
                <option value="25000">25 km</option>
              </select>
            </label>
            <label class="checkbox"><input type="checkbox" id="includeClinics" checked> Clinics</label>
            <label class="checkbox"><input type="checkbox" id="emergencyOnly"> Emergency only</label>
          </div>

          <div id="recent" class="recent hidden">
            <span class="recent-label">Recent</span>
            <div id="recentList" class="chips"></div>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Results">
          <button type="button" role="tab" class="tab active" id="tabNearby" aria-selected="true" aria-controls="results">Nearby</button>
          <button type="button" role="tab" class="tab" id="tabSaved" aria-selected="false" aria-controls="results">Saved <span class="tab-count" id="savedCount">0</span></button>
        </div>

        <div class="results-head" id="resultsHead">
          <span id="resultsSummary">No search yet</span>
        </div>

        <ul class="results" id="results" aria-live="polite"></ul>
      </section>

      <div class="map-wrap">
        <div id="map" role="application" aria-label="Map of nearby hospitals"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/site.js"></script>
  <script src="js/finder.js"></script>
</body>
</html>
